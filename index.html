<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel — Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">


</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand-row">
      <div class="brand"><span class="dot"></span> Reel</div>
      <button id="add-song-btn" title="Add a song from your PC">+</button>
    </div>
    <input type="file" id="file-picker" accept="audio/*" multiple style="display:none;">

    <div class="side-section">
      <h4>Categories</h4>
      <ul class="cat-list" id="cat-list"></ul>
    </div>

    <div class="playlist-box">
      <h4>My Playlist</h4>
      <ul id="playlist-items"></ul>
      <p class="empty-note" id="playlist-empty">Tap + on any track to add it here.</p>
    </div>
  </aside>

  <main class="main">
    <div class="top-row">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="Search by track or artist…" />
      </div>
    </div>

    <h1 class="page-title" id="page-title">All Tracks</h1>
    <p class="page-sub" id="page-sub">12 tracks · click a row to play</p>

    <div class="chip-row" id="chip-row"></div>

    <table class="track-table">
      <thead>
        <tr>
          <th class="idx-cell">#</th>
          <th>Title</th>
          <th>Category</th>
          <th class="dur-cell">Time</th>
          <th class="add-cell"></th>
        </tr>
      </thead>
      <tbody id="track-body"></tbody>
    </table>
    <div class="no-results" id="no-results" style="display:none;">No tracks match your search.</div>
  </main>
</div>

<div class="player-bar">
  <div class="now-playing">
    <div class="reel-cover" id="reel-cover"><div class="reel"></div></div>
    <div class="np-text">
      <div class="t" id="np-title">Nothing playing</div>
      <div class="a" id="np-artist">Pick a track to start</div>
    </div>
  </div>

  <div class="controls-wrap">
    <div class="transport">
      <button id="prev-btn" title="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
      </button>
      <button class="play-btn" id="play-btn" title="Play">
        <svg id="play-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="next-btn" title="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
      </button>
    </div>
    <div class="seek-row">
      <span class="time" id="time-cur">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" />
      <span class="time right" id="time-dur">0:00</span>
    </div>
  </div>

  <div class="volume-wrap">
    <button id="mute-btn">
      <svg id="vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
    </button>
    <input type="range" id="volume" min="0" max="100" value="70" />
  </div>
</div>
        <script src="script.js"></script>

</body>
</html>
